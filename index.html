<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Web Application</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container-fluid px-4">
            <span class="navbar-brand mb-0 h1">My To-Do List</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Task Card -->
                <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
                    
                    <!-- Heading -->
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Task Manager</h2>
                        <p class="text-muted small">Organize your tasks and stay productive</p>
                    </div>

                    <!-- Input Section -->
                    <div class="input-group mb-2">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                        <button class="btn btn-primary" id="addTaskBtn">Add Task</button>
                    </div>
                    <!-- Error Message Display -->
                    <div id="errorMsg" class="text-danger small mb-3" style="display: none;"></div>

                    <!-- Tasks Header & Counter -->
                    <div class="d-flex justify-content-between align-items-center mb-3 mt-2">
                        <span class="fw-semibold text-secondary">Your tasks</span>
                        <span id="taskCounter" class="badge bg-primary">0 remaining</span>
                    </div>

                    <!-- Filter Buttons -->
                    <div class="btn-group w-100 mb-4 shadow-sm" role="group">
                        <button type="button" class="btn btn-outline-primary active filter-btn" data-filter="all">All</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="active">Active</button>
                        <button type="button" class="btn btn-outline-primary filter-btn" data-filter="completed">Completed</button>
                    </div>

                    <!-- Task List Container -->
                    <ul id="taskList" class="list-group mb-3">
                        <!-- Tasks will be dynamically added here -->
                    </ul>

                    <!-- Empty State Message -->
                    <div id="emptyState" class="text-center text-muted py-3">
                        No tasks yet. Add your first task!
                    </div>

                    <!-- Clear Completed Button -->
                    <button id="clearCompletedBtn" class="btn btn-outline-danger btn-sm w-100 mt-2">Clear Completed</button>

                </div>
            </div>
        </div>
    </div>

    <!-- Script File -->
    <script src="script.js"></script>
</body>
</html>
